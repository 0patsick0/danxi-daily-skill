name = "danxi-daily-clock"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "d48c366aa5fb668f1d55734f08ad26ba"
workers_dev = true

# Cloudflare cron is UTC. 23:30 CST = 15:30 UTC.
# Catch-up 10 minutes later so posting still finishes before midnight.
# GitHub schedule: is not used.
[triggers]
crons = ["30 15 * * *", "40 15 * * *"]
