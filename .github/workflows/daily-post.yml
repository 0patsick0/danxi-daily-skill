name: DanXi Daily Auto Post

permissions:
  contents: write

on:
  # GitHub's built-in `schedule:` trigger was tested at 21:30, 21:23, and
  # 20:40 CST between 2026-08-26 and 2026-08-29 and consistently fired ~9.5
  # hours late (always landing around 07:00 CST the next morning) regardless
  # of the configured time. 22:00 CST fired correctly on 2026-08-29, so
  # keeping the native schedule trigger. If this drifts again, switch to
  # the external cron + workflow_dispatch approach documented in
  # docs/scheduling.md (Option D).
  schedule:
    - cron: "39 12 * * *" # 20:39 China Standard Time (UTC+8)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate report only, skip posting"
        type: boolean
        default: false

jobs:
  auto-post:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: danxi-daily-auto-post
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and post daily report
        env:
          TZ: Asia/Shanghai
          DANXI_API_TOKEN: ${{ secrets.DANXI_API_TOKEN }}
          DANXI_POST_ENDPOINT: ${{ secrets.DANXI_POST_ENDPOINT }}
          DANXI_POST_TOKEN: ${{ secrets.DANXI_POST_TOKEN }}
          DANXI_WEBVPN_USERNAME: ${{ secrets.DANXI_WEBVPN_USERNAME }}
          DANXI_WEBVPN_PASSWORD: ${{ secrets.DANXI_WEBVPN_PASSWORD }}
          DANXI_ARCHIVE_OUTPUTS: "false"
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ -z "$DANXI_WEBVPN_USERNAME" ] || [ -z "$DANXI_WEBVPN_PASSWORD" ]; then
            echo "::error::Missing required secrets: DANXI_WEBVPN_USERNAME or DANXI_WEBVPN_PASSWORD"
            exit 1
          fi

          # GitHub Actions runners cannot reach campus endpoints directly.
          # Use WebVPN force mode; API token auto-refreshes via WebVPN on expiry.
          # NOTE: No --post-at gate here; the cron schedule itself controls timing.
          args=(
            --hours 24
            --top 12
            --base-urls "https://forum.fduhole.com/api"
            --webvpn-mode force
            --webvpn-no-prompt
            --verbose
          )

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: generating report only, skipping post."
          else
            if [ -z "$DANXI_POST_ENDPOINT" ] || [ -z "$DANXI_POST_TOKEN" ]; then
              echo "::error::Missing required secrets: DANXI_POST_ENDPOINT or DANXI_POST_TOKEN"
              exit 1
            fi
            args+=(--post --post-endpoint "$DANXI_POST_ENDPOINT")
          fi

          python scripts/generate_daily.py "${args[@]}"

      - name: Persist dedupe state
        if: success()
        run: |
          # last_post.sha256 is committed to the repo so duplicate-post
          # detection survives across CI runs (each run gets a fresh checkout).
          if [ -n "$(git status --porcelain outputs/last_post.sha256 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add outputs/last_post.sha256
            git commit -m "chore: update post dedupe state [skip ci]"
            git push
          else
            echo "No dedupe state change to persist."
          fi

      - name: Upload generated report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: danxi-daily-report
          path: |
            outputs/daily.md
            outputs/ranked.json
            outputs/holes.raw.json
          if-no-files-found: warn
