name: DanXi Daily Auto Post

permissions:
  contents: write
  issues: write

on:
  # Do NOT use GitHub native schedule:. It has fired hours late for this
  # repo and, after midnight, bypassed the calendar-day post guard.
  # Clock is Cloudflare Worker cron -> workflow_dispatch only.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate report only, skip posting"
        type: boolean
        default: false

jobs:
  auto-post:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: danxi-daily-auto-post
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and post daily report
        env:
          TZ: Asia/Shanghai
          DANXI_API_TOKEN: ${{ secrets.DANXI_API_TOKEN }}
          DANXI_POST_ENDPOINT: ${{ secrets.DANXI_POST_ENDPOINT }}
          DANXI_POST_TOKEN: ${{ secrets.DANXI_POST_TOKEN }}
          DANXI_WEBVPN_USERNAME: ${{ secrets.DANXI_WEBVPN_USERNAME }}
          DANXI_WEBVPN_PASSWORD: ${{ secrets.DANXI_WEBVPN_PASSWORD }}
          DANXI_ARCHIVE_OUTPUTS: "false"
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ -z "$DANXI_WEBVPN_USERNAME" ] || [ -z "$DANXI_WEBVPN_PASSWORD" ]; then
            echo "::error::Missing required secrets: DANXI_WEBVPN_USERNAME or DANXI_WEBVPN_PASSWORD"
            exit 1
          fi

          # GitHub Actions runners cannot reach campus endpoints directly.
          # Use WebVPN force mode; API token auto-refreshes via WebVPN on expiry.
          # Day boundary is 22:00 Asia/Shanghai, not calendar midnight.
          args=(
            --hours 24
            --top 12
            --base-urls "https://forum.fduhole.com/api"
            --webvpn-mode force
            --webvpn-no-prompt
            --post-once-per-day
            --post-at 22:00
            --verbose
          )

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: generating report only, skipping post."
          else
            if [ -z "$DANXI_POST_ENDPOINT" ] || [ -z "$DANXI_POST_TOKEN" ]; then
              echo "::error::Missing required secrets: DANXI_POST_ENDPOINT or DANXI_POST_TOKEN"
              exit 1
            fi
            args+=(--post --post-endpoint "$DANXI_POST_ENDPOINT")
          fi

          python scripts/generate_daily.py "${args[@]}"

      - name: Persist dedupe state
        if: success()
        run: |
          # last_post.sha256 and last_post_slot.txt are committed so
          # duplicate-post / once-per-day detection survives across CI runs.
          changed=0
          for path in outputs/last_post.sha256 outputs/last_post_slot.txt; do
            if [ -n "$(git status --porcelain "$path" 2>/dev/null)" ]; then
              git add "$path"
              changed=1
            fi
          done
          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update post dedupe state [skip ci]"
            git push
          else
            echo "No dedupe state change to persist."
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="$(TZ=Asia/Shanghai date +%F)"
          title="DanXi daily auto-post failed on ${day}"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="$(cat <<EOF
          GitHub Actions run failed: ${url}

          Typical causes:
          1. GitHub native \`schedule:\` skipped or ran late (use external dispatch).
          2. \`DANXI_API_TOKEN\` expired and WebVPN re-login failed.
          3. \`DANXI_WEBVPN_USERNAME\` / \`DANXI_WEBVPN_PASSWORD\` secrets are stale.

          Do **not** keep re-running until WebVPN credentials are confirmed —
          a wrong password can lock the campus account.
          EOF
          )"
          existing="$(gh issue list --state open --search "in:title ${title}" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Upload generated report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: danxi-daily-report
          path: |
            outputs/daily.md
            outputs/ranked.json
            outputs/holes.raw.json
          if-no-files-found: warn
